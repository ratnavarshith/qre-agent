name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # IBM's bicycle compiler, built from a pinned commit (the one the results were made with) and
  # the pinned dependency versions in ci/bicycle-Cargo.lock; upstream does not commit a Cargo.lock.
  COMPILER_REPO: qiskit-community/bicycle-architecture-compiler
  COMPILER_COMMIT: bed7e8aba4cc0fb86311b7fa6dad6217c0fce7cb
  QRE_COMPILER_DIR: ${{ github.workspace }}/bicycle-compiler/target/release

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: Check out the bicycle compiler
        uses: actions/checkout@v5
        with:
          repository: ${{ env.COMPILER_REPO }}
          ref: ${{ env.COMPILER_COMMIT }}
          path: bicycle-compiler

      # One cache for the cargo build and the Clifford lookup tables, keyed on the compiler commit.
      - name: Restore compiler build and lookup tables
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            bicycle-compiler/target
            ~/.cargo/registry
            cache
          key: bicycle-${{ runner.os }}-${{ env.COMPILER_COMMIT }}-${{ hashFiles('ci/bicycle-Cargo.lock') }}

      - name: Build the compiler
        working-directory: bicycle-compiler
        run: |
          cp "$GITHUB_WORKSPACE/ci/bicycle-Cargo.lock" Cargo.lock
          cargo build --release --locked -F bicycle_compiler/rsgridsynth -p bicycle_compiler -p bicycle_numerics

      - name: Generate lookup tables
        run: |
          mkdir -p cache
          pids=""
          for code in gross two-gross; do
            if [ ! -s "cache/table_$code" ]; then
              "$QRE_COMPILER_DIR/bicycle_compiler" "$code" generate "cache/table_$code" &
              pids="$pids $!"
            fi
          done
          for pid in $pids; do wait "$pid"; done

      - name: Save compiler build and lookup tables
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            bicycle-compiler/target
            ~/.cargo/registry
            cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: pytest
        run: pytest -q -rs
