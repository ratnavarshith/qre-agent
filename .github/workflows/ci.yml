name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # also runs the eval gate

permissions:
  contents: read

env:
  # IBM's bicycle compiler, built from a pinned commit (the one the results were made with) and
  # the pinned dependency versions in ci/bicycle-Cargo.lock; upstream does not commit a Cargo.lock.
  COMPILER_REPO: qiskit-community/bicycle-architecture-compiler
  COMPILER_COMMIT: bed7e8aba4cc0fb86311b7fa6dad6217c0fce7cb
  QRE_COMPILER_DIR: ${{ github.workspace }}/bicycle-compiler/target/release

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: Check out the bicycle compiler
        uses: actions/checkout@v5
        with:
          repository: ${{ env.COMPILER_REPO }}
          ref: ${{ env.COMPILER_COMMIT }}
          path: bicycle-compiler

      # One cache for the cargo build and the Clifford lookup tables, keyed on the compiler commit.
      - name: Restore compiler build and lookup tables
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            bicycle-compiler/target
            ~/.cargo/registry
            cache
          key: bicycle-${{ runner.os }}-${{ env.COMPILER_COMMIT }}-${{ hashFiles('ci/bicycle-Cargo.lock') }}

      - name: Build the compiler
        working-directory: bicycle-compiler
        run: |
          cp "$GITHUB_WORKSPACE/ci/bicycle-Cargo.lock" Cargo.lock
          cargo build --release --locked -F bicycle_compiler/rsgridsynth -p bicycle_compiler -p bicycle_numerics

      - name: Generate lookup tables
        run: |
          mkdir -p cache
          pids=""
          for code in gross two-gross; do
            if [ ! -s "cache/table_$code" ]; then
              "$QRE_COMPILER_DIR/bicycle_compiler" "$code" generate "cache/table_$code" &
              pids="$pids $!"
            fi
          done
          for pid in $pids; do wait "$pid"; done

      - name: Save compiler build and lookup tables
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            bicycle-compiler/target
            ~/.cargo/registry
            cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: debug memory of the sandbox child (temporary)
        run: |
          cat > /tmp/vm.py <<'EOF'
          import os, sys
          def vm(tag):
              d = dict(l.split(":", 1) for l in open("/proc/self/status") if l.startswith("Vm"))
              print(tag, {k: d[k].strip() for k in ("VmPeak", "VmSize", "VmData", "VmRSS", "VmHWM")}, flush=True)
          vm("start")
          from qiskit import QuantumCircuit, qpy
          vm("qiskit")
          import numpy, math
          import qiskit.circuit.library
          vm("library")
          import unicodedata
          vm("unicodedata")
          import numpy as np
          x = np.ones(10_000_000)
          vm("80MB array")
          EOF
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 RAYON_NUM_THREADS=1 python -I /tmp/vm.py
          python -I /tmp/vm.py
          ulimit -a | head -20

      - name: pytest
        run: timeout 900 pytest -v -rs -o faulthandler_timeout=240

      # The sandbox tests that need root: a broker as the user `nobody`, which has to be able to
      # reach the Python install and the source. QRE_REQUIRE_ROOT_TESTS=1 makes a skip a failure.
      - name: pytest, sandbox broker as another user
        run: |
          p="$GITHUB_WORKSPACE"
          while [ "$p" != / ]; do sudo chmod o+x "$p"; p=$(dirname "$p"); done
          sudo env "PATH=$PATH" QRE_REQUIRE_ROOT_TESTS=1 \
            python -m pytest tests/test_sandbox_broker.py -q -rs -p no:cacheprovider

  # Paths whose change can change the agent's answers: the code (the system prompt is in
  # src/qre_agent/agent.py), the evals, and what feeds them.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          agent=false
          for f in $(git diff --name-only "$BASE_SHA" HEAD); do
            case "$f" in
              src/*|evals/*|assumptions/*|scripts/run_eval.py|scripts/ci_gate.py|budgets.yaml|requirements.txt|pyproject.toml|.github/workflows/ci.yml)
                agent=true ;;
            esac
          done
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

  # Runs 10 eval tasks on Gemini 2.5 Flash with the repository secret OPENROUTER_API_KEY (a key with
  # a hard credit limit) and fails if the agent regressed, or if it could not run (see
  # scripts/ci_gate.py). Skipped, not failed, when no agent path changed.
  eval-gate:
    needs: [test, changes]
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: eval-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Check out the bicycle compiler
        uses: actions/checkout@v5
        with:
          repository: ${{ env.COMPILER_REPO }}
          ref: ${{ env.COMPILER_COMMIT }}
          path: bicycle-compiler

      # The test job saves this cache; this job only reads it.
      - name: Restore compiler build and lookup tables
        uses: actions/cache/restore@v5
        with:
          path: |
            bicycle-compiler/target
            ~/.cargo/registry
            cache
          key: bicycle-${{ runner.os }}-${{ env.COMPILER_COMMIT }}-${{ hashFiles('ci/bicycle-Cargo.lock') }}

      - name: Build the compiler
        working-directory: bicycle-compiler
        run: |
          cp "$GITHUB_WORKSPACE/ci/bicycle-Cargo.lock" Cargo.lock
          cargo build --release --locked -F bicycle_compiler/rsgridsynth -p bicycle_compiler -p bicycle_numerics

      - name: Generate lookup tables
        run: |
          mkdir -p cache
          pids=""
          for code in gross two-gross; do
            if [ ! -s "cache/table_$code" ]; then
              "$QRE_COMPILER_DIR/bicycle_compiler" "$code" generate "cache/table_$code" &
              pids="$pids $!"
            fi
          done
          for pid in $pids; do wait "$pid"; done

      # Estimates are keyed on the circuit, assumptions, versions and estimator code, so a hit is
      # never stale; the key includes the estimator sources only to start a fresh cache when they
      # change. Each run saves under its own run id, so new estimates are kept.
      - name: Restore and save the estimate cache
        uses: actions/cache@v5
        with:
          path: cache/estimates
          key: estimates-${{ runner.os }}-${{ env.COMPILER_COMMIT }}-${{ hashFiles('src/qre_agent/surface.py', 'src/qre_agent/bicycle.py', 'src/qre_agent/pbc.py', 'src/qre_agent/compiler.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            estimates-${{ runner.os }}-${{ env.COMPILER_COMMIT }}-${{ hashFiles('src/qre_agent/surface.py', 'src/qre_agent/bicycle.py', 'src/qre_agent/pbc.py', 'src/qre_agent/compiler.py', 'requirements.txt') }}-

      - name: Grader self-test (no API calls)
        run: python scripts/run_eval.py --self-test

      - name: Eval gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/ci_gate.py evals/ci-gate.yaml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gate
          path: |
            results/ci/gate
            runs
          if-no-files-found: ignore
