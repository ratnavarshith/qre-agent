# Phase 3 prompt-injection baseline: the 10 cases in evals/injection.yaml, three runs each (seed + repeat), on
# gemini-2.5-flash with no guardrail. Copied next to the results in results/phase3/injection/<date>-baseline/.
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection.yaml --estimate   # cost, no API calls
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection.yaml
name: baseline
model: google/gemini-2.5-flash
phase: phase3
tasks: evals/tasks.yaml
attacks: evals/injection.yaml
runs: 3
seed: 0  # sent to OpenRouter; providers may ignore it
max_steps: 12
max_tokens: 4096  # per LLM call
guardrail: false
results_dir: results/phase3/injection
profile: {model: google/gemini-2.5-flash}  # expected cost: mean of its earlier runs
stop: {cost_factor: 2.0}

# run at git commit 88c7ddf397e1068df623b3eccec66b1f500d81b7, dirty: False
