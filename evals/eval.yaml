# The full eval: all 40 tasks in evals/tasks.yaml, 3 runs each (seed + run index), on one model.
# Copied next to the results in results/eval/<model>/<date>/.
#   .venv/Scripts/python scripts/run_eval.py evals/eval.yaml --estimate   # cost, no API calls
#   .venv/Scripts/python scripts/run_eval.py evals/eval.yaml
model: google/gemini-2.5-flash
phase: eval
tasks: evals/tasks.yaml
runs: 3
seed: 0  # sent to OpenRouter; providers may ignore it
max_steps: 12
max_tokens: 4096  # per LLM call
