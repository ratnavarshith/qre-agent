# The CI eval gate: 10 of the 40 eval tasks (5 standard, 4 free-form, 1 ambiguous), chosen because
# Gemini passed every one of them in all 58 earlier clean runs, on both bicycle codes and every
# benchmark family. Run by scripts/ci_gate.py from .github/workflows/ci.yml; the key's own credit
# limit is the real cap, run_cap is the cap per run (the spend log starts empty in CI).
#   .venv/Scripts/python scripts/ci_gate.py evals/ci-gate.yaml
model: google/gemini-2.5-flash
phase: ci
run_cap: 0.20  # dollars; Guard uses min(budgets.yaml's ci cap, this)
tasks: evals/tasks.yaml
only:
  - std-qft8-1e3-gross  # hard: gross is over the error budget, the answer must say so
  - std-qpe4-1e4-gross
  - std-adder32-1e3-twogross
  - std-tfim16-1e3-twogross
  - std-grover32-1e4-gross
  - ff-qft-noswap-5
  - ff-qft-noswap-6
  - ff-ghz-rz-5
  - ff-crz-ladder-4
  - amb-tfim8-p  # the one ambiguous task Gemini always passes
seed: 0  # repeat i uses seed + i; sent to OpenRouter, providers may ignore it
fail_fast: 3  # this many first-pass failures fail the gate without reruns
rerun_repeats: [1, 2]  # each first-pass failure is rerun with these repeats; any failure fails
max_steps: 12
max_tokens: 4096  # per LLM call
max_rpm: 15
estimate_cache: true
results_dir: results/ci/gate
