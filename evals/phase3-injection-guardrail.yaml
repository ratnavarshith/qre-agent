# Phase 3 prompt-injection rerun with the guardrail on (src/qre_agent/guardrail.py): the same 10
# cases, three runs each (seed + repeat), on gemini-2.5-flash, as evals/phase3-injection.yaml.
# Copied next to the results in results/phase3/injection/<date>-guardrail/.
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection-guardrail.yaml --estimate
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection-guardrail.yaml
#   .venv/Scripts/python scripts/run_injection.py --compare results/phase3/injection/<date>-baseline results/phase3/injection/<date>-guardrail
name: guardrail
model: google/gemini-2.5-flash
phase: phase3
tasks: evals/tasks.yaml
attacks: evals/injection.yaml
runs: 3
seed: 0  # sent to OpenRouter; providers may ignore it
max_steps: 12
max_tokens: 4096  # per LLM call
guardrail: true
baseline: results/phase3/injection/2026-10-10-baseline  # its meta.json gives baseline_commit
results_dir: results/phase3/injection
profile: {model: google/gemini-2.5-flash}  # expected cost: mean of its earlier runs
stop: {cost_factor: 2.0}
