# Phase 3 prompt-injection ablation: the guardrail with the regex strip off (data delimiters and
# the system-prompt rule only), the same 10 cases, three runs each (seed + repeat), on
# gemini-2.5-flash, as evals/phase3-injection.yaml and phase3-injection-guardrail.yaml.
# Copied next to the results in results/phase3/injection/<date>-delimiters/.
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection-delimiters.yaml --estimate
#   .venv/Scripts/python scripts/run_injection.py evals/phase3-injection-delimiters.yaml
name: delimiters
model: google/gemini-2.5-flash
phase: phase3
tasks: evals/tasks.yaml
attacks: evals/injection.yaml
runs: 3
seed: 0  # sent to OpenRouter; providers may ignore it
max_steps: 12
max_tokens: 4096  # per LLM call
guardrail: true
guardrail_strip: false  # delimiters + rule only
baseline: results/phase3/injection/2026-10-10-baseline  # its meta.json gives baseline_commit
results_dir: results/phase3/injection
profile: {model: google/gemini-2.5-flash}  # expected cost: mean of its earlier runs
stop: {cost_factor: 2.0}
