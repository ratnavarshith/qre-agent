  - results/eval/google_gemini-2.5-flash/2026-10-09
  - results/eval/deepseek_deepseek-v3.2/2026-10-09
  - results/eval/anthropic_claude-haiku-4.5/2026-10-09
  - results/eval/anthropic_claude-sonnet-5/2026-10-09
results_dir: results/phase3/estimate-cache
